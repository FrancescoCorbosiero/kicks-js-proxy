# Store Hub in production, behind caddy-docker-proxy: Caddy reads the labels
# below and serves both addresses over HTTPS, certificates included. Authelia
# (once per server, from /srv/authelia: see docs/auth.md) signs people in
# before any request reaches the app.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# Walkthrough: docs/deploy.md and docs/auth.md. (The docker-compose.yml at the
# repo root is local development only.)
#
# The stack's name prefixes its containers, image and database volume. A
# second shop on the same server sets its own COMPOSE_PROJECT_NAME in its
# deploy/.env, which takes precedence over this default.
name: store-hub

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://kicks:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/kicks
      REDIS_URL: redis://redis:6379
      # On the public internet the sign-in is not optional: the app refuses
      # every request that did not come through Caddy and Authelia.
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?set AUTH_PROXY_SECRET in deploy/.env}
      VETRINA_HOST: ${VETRINA_HOST:?set VETRINA_HOST in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caddy
      - internal
    labels:
      # One site, both addresses. Caddy passes the Host header through and the
      # app tells the Hub from the Vetrina by it.
      caddy: ${HUB_HOST:?set HUB_HOST in deploy/.env}, ${VETRINA_HOST}
      # Signing in, on each address under /authelia (docs/auth.md):
      # - /authelia/ is the sign-in page, where Authelia sends anyone without a
      #   session: the app's own (src/app/sign-in), in the Hub's look. It posts
      #   to Authelia's API below, which checks the password and sets the
      #   session. No session needed, but still the secret: only Caddy may ask.
      # - the rest of /authelia/ is Authelia: its API, and its own pages
      #   (settings, a second factor if one is ever required).
      # Caddy tries the exact /authelia/ before /authelia/* on every version.
      caddy.redir: /authelia /authelia/ 308
      caddy.handle_0: /authelia/
      caddy.handle_0.rewrite: "* /sign-in"
      caddy.handle_0.reverse_proxy: "{{upstreams 3000}}"
      caddy.handle_0.reverse_proxy.header_up: X-Auth-Proxy-Secret ${AUTH_PROXY_SECRET}
      caddy.handle_1: /authelia/*
      caddy.handle_1.reverse_proxy: authelia:9091
      # Everything else, in this order (the route keeps it):
      # 0. drop every Remote-* header the visitor sent: only Authelia says who
      #    someone is. Caddy 2.11.2 and newer do this in forward_auth; older
      #    ones pass a visitor's own Remote-User on wherever Authelia sets none.
      # 1. check with Authelia: not signed in → its sign-in page; signed in but
      #    not allowed on this address → 403. What it allows carries who is
      #    signed in (Remote-*). Authelia down → 502: nothing gets through
      #    unchecked.
      # 2. on to the app, with the secret that tells it the request came this way.
      caddy.handle_2.route.0_request_header: "-Remote-*"
      caddy.handle_2.route.1_forward_auth: authelia:9091
      caddy.handle_2.route.1_forward_auth.uri: /api/authz/forward-auth
      caddy.handle_2.route.1_forward_auth.copy_headers: Remote-User Remote-Groups Remote-Email Remote-Name
      caddy.handle_2.route.2_reverse_proxy: "{{upstreams 3000}}"
      caddy.handle_2.route.2_reverse_proxy.header_up: X-Auth-Proxy-Secret ${AUTH_PROXY_SECRET}
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kicks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kicks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicks -d kicks"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

  redis:
    # A cache of KicksDB answers: nothing to keep on disk, capped in memory.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

networks:
  # The network your caddy-docker-proxy container watches.
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  # Postgres and Redis: reachable by the app only, never published.
  internal: {}

volumes:
  pgdata:
