# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/user-database.json
# -----------------------------------------------------------------------------
# Who can sign in. Copy to users.yml (same folder) and replace both examples.
# Edits apply without a restart.
#
# Groups decide which addresses a person opens (access_control in
# configuration.yml): `operators` open the Hub and every Vetrina; a shop's own
# group (here `resellpiacenza`) opens that shop's Vetrina only.
#
# Passwords go in as a hash, never in clear. Make one with:
#   docker run --rm -it authelia/authelia:4.39 authelia crypto hash generate argon2
# and paste the "Digest:" value. Authelia does not start until every password
# below is a real hash.
#
# To remove someone: delete their entry, or add `disabled: true` to keep it.
# -----------------------------------------------------------------------------
users:
  operator:
    displayname: Operator
    email: operator@example.com
    password: paste-the-digest-here
    groups:
      - operators
  shop:
    displayname: Resell Piacenza
    email: shop@example.com
    password: paste-the-digest-here
    groups:
      - resellpiacenza
