# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
# -----------------------------------------------------------------------------
# Authelia for Store Hub. Copy to configuration.yml (same folder), then change
# the addresses in the two places marked CHANGE: `session.cookies` (where
# people sign in) and `access_control` (who may open what). The rest is the
# house setup, explained in docs/auth.md. No secrets in here: they are files
# in ../secrets.
# -----------------------------------------------------------------------------

theme: auto
# New users are offered a passkey first (Face ID, fingerprint, a security key).
default_2fa_method: webauthn

server:
  # The sign-in pages are served on each protected address under /authelia
  # (Caddy sends /authelia* here): the Vetrina's home-screen app signs in
  # without leaving its own address. Caddy's checks go to /api/authz/...,
  # which Authelia answers too.
  address: tcp://:9091/authelia

log:
  level: info

totp:
  # The name shown in the authenticator app.
  issuer: Store Hub

webauthn:
  display_name: Store Hub
  # "Sign in with a passkey" replaces typing the username. It counts as one
  # factor, so the password is asked next: a passkey plus a password is the
  # two factors every address requires.
  enable_passkey_login: true

identity_validation:
  elevated_session:
    # Adding or removing a 2FA device: someone who already has one confirms
    # with it. The first device needs a one-time code instead (see notifier).
    require_second_factor: true
    skip_second_factor: true

authentication_backend:
  # No email server, so no "forgot password" link: an operator sets a new one
  # (docs/auth.md). Signed in, people can change their own password.
  password_reset:
    disable: true
  file:
    path: /etc/authelia/users.yml
    # Edits to users.yml apply without a restart.
    watch: true

password_policy:
  # Applies when someone changes their password from the sign-in pages.
  zxcvbn:
    enabled: true
    min_score: 3

session:
  # Kept in Redis on disk (docker-compose.yml): restarts sign nobody out.
  redis:
    host: redis
    port: 6379
  # Without "Remember me": signed out after an idle hour, or after 12 hours.
  inactivity: 1 hour
  expiration: 12 hours
  # With "Remember me", and always after a passkey sign-in: a month, idle or
  # not.
  remember_me: 1 month
  cookies:
    # CHANGE: one entry per address, each with its own sign-in pages. A
    # session is valid on its own address only: signing in on the Hub does not
    # open the Vetrina, and the cookie never reaches the shop's own site or any
    # other subdomain.
    - domain: hub.resellpiacenza.shop
      authelia_url: https://hub.resellpiacenza.shop/authelia
      default_redirection_url: https://hub.resellpiacenza.shop/
    - domain: vetrina.resellpiacenza.shop
      authelia_url: https://vetrina.resellpiacenza.shop/authelia
      default_redirection_url: https://vetrina.resellpiacenza.shop/
      # The phone app stays signed in for three months, as it did with the
      # old password.
      remember_me: 3 months

regulation:
  # Five wrong passwords for a user within ten minutes lock that user out for
  # fifteen. By user, not by IP: behind Cloudflare every visitor arrives from
  # Cloudflare's addresses, and banning one of those would lock out everyone
  # who shares it.
  modes:
    - user
  max_retries: 5
  find_time: 10 minutes
  ban_time: 15 minutes

storage:
  # 2FA devices, passkeys and bans: in the data volume (docker-compose.yml).
  local:
    path: /config/db.sqlite3

notifier:
  # No email server: one-time codes are written to this file, and an operator
  # passes them on (docs/auth.md, "Add a person"). With an SMTP server
  # instead, people receive them by email.
  filesystem:
    filename: /config/notification.txt

access_control:
  # Anything not allowed below is refused, including any address Caddy sends
  # here that is not listed.
  default_policy: deny
  rules:
    # CHANGE: the same addresses as in session.cookies, in every rule.

    # The home-screen app's install files: they hold no data, and phones
    # fetch them without the session cookie.
    - domain:
        - hub.resellpiacenza.shop
        - vetrina.resellpiacenza.shop
      resources:
        - '^/manifest\.webmanifest$'
        - '^/(apple-)?icon([?].*)?$'
      policy: bypass

    # The Hub: operators only.
    - domain: hub.resellpiacenza.shop
      subject: 'group:operators'
      policy: two_factor

    # The Vetrina: the shop's own people, and the operators.
    - domain: vetrina.resellpiacenza.shop
      subject:
        - 'group:operators'
        - 'group:resellpiacenza'
      policy: two_factor

    # Only if an external scheduler calls the Hub's cron endpoints
    # (SCHEDULER=off and CRON_SECRET, see the README): they carry their own
    # secret instead of a session. Not needed with the in-app scheduler.
    # - domain: hub.resellpiacenza.shop
    #   resources:
    #     - '^/api/cron/'
    #   methods:
    #     - POST
    #   policy: bypass
