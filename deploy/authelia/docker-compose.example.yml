# Authelia: the sign-in in front of every Store Hub address on this server.
# Caddy asks it about each request (forward auth) before the app sees it.
# One per server, like Caddy: a second shop adds its addresses to
# config/configuration.yml instead of running another one.
#
# This folder is a template. Authelia runs from a copy in a folder of its
# own, next to Caddy's, never from a shop's checkout:
#
#   cp -r deploy/authelia /srv/authelia && cd /srv/authelia
#   mv docker-compose.example.yml docker-compose.yml
#   # secrets, config and users: docs/auth.md, "Set up Authelia"
#   docker compose up -d
#
# Here the file is named .example on purpose: "docker compose" run in a
# checkout finds nothing to start, so it can't replace the running
# Authelia with this folder's settings.
#
# The shop stacks reach it as authelia:9091 on Caddy's network (their labels
# in deploy/docker-compose.yml), so the service keeps that name. The project
# name below is fixed, so its volumes keep their names wherever it runs from.
name: authelia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      # Settings, users and secrets live outside /config: the image chowns
      # /config at start, and there it only touches the data volume below.
      X_AUTHELIA_CONFIG: /etc/authelia/configuration.yml
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage_encryption_key
      TZ: ${TZ:-Europe/Rome}
    secrets:
      - session_secret
      - storage_encryption_key
    volumes:
      # A folder, not single files: editors replace a file when they save, and
      # a single-file mount would keep showing the old one. Writable because
      # Authelia saves users.yml when someone changes their password.
      - ./config:/etc/authelia
      # The database (2FA devices, passkeys, bans) and notification.txt.
      - data:/config
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - caddy
      - internal
    logging: *logging

  redis:
    # The sessions, saved to disk: a restart or a reboot signs nobody out.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

secrets:
  session_secret:
    file: ./secrets/SESSION_SECRET
  storage_encryption_key:
    file: ./secrets/STORAGE_ENCRYPTION_KEY

networks:
  # The network your caddy-docker-proxy container watches (the same one the
  # shop stacks join).
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  # The session store: reachable by Authelia only.
  internal: {}

volumes:
  data:
  sessions:
